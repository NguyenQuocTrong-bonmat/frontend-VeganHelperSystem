name: Frontend CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy main to Azure after CI (requires AZURE_DEPLOY_ENABLED=true)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOONG_MAPTILES_KEY: ${{ secrets.VITE_GOONG_MAPTILES_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check production API configuration
        if: vars.AZURE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        run: |
          node --input-type=module <<'JS'
          const value = process.env.VITE_API_BASE_URL;
          let url;
          try { url = new URL(value); } catch { throw new Error('Set repository secret VITE_API_BASE_URL to the HTTPS backend URL ending in /api.'); }
          if (url.protocol !== 'https:' || ['localhost', '127.0.0.1', '[::1]', '0.0.0.0'].includes(url.hostname) || url.username || url.password || url.search || url.hash || !url.pathname.replace(/\/$/, '').endsWith('/api')) {
            throw new Error('VITE_API_BASE_URL must be a public HTTPS API URL ending in /api, without credentials or query parameters.');
          }
          JS

      - run: npm run build

      - name: Check SPA deployment files
        run: |
          test -f build/index.html
          test -f build/staticwebapp.config.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: build/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy frontend production
    needs: ci
    if: vars.AZURE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deployment token
        env:
          DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo '::error::Set repository secret AZURE_STATIC_WEB_APPS_API_TOKEN before enabling deployment.'
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build
          path: build/

      - name: Get GitHub identity token
        id: github_identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          result-encoding: string
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            return token;

      - name: Deploy to Azure Static Web Apps
        id: azure_deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # Official default branch, verified 2026-10-14
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          github_id_token: ${{ steps.github_identity.outputs.result }}
          action: upload
          app_location: build
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main

      - name: Check deployed frontend
        env:
          DEPLOYED_URL: ${{ steps.azure_deploy.outputs.static_web_app_url }}
        run: |
          if [[ ! "$DEPLOYED_URL" =~ ^https://[^/]+/?$ ]]; then
            echo '::error::Azure did not return a valid frontend URL; check the deployment log.'
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 20 --output /dev/null "${DEPLOYED_URL%/}/"
